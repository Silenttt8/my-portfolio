    <path d="M15 15V49H22V36H28C34 36 38 32 38 25.5C38 19 34 15 28 15H15ZM22 21.5H27C29.5 21.5 31 23 31 25.5C31 28 29.5 29.5 27 29.5H22V21.5Z" fill="url(#cyberGrad)"/>
    
